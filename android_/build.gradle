buildscript {
    ext {
        buildToolsVersion = "34.0.0"   // 👈 change from 36
        minSdkVersion = 24
        compileSdkVersion = 34         // 👈 change from 36
        targetSdkVersion = 34          // 👈 change from 36
        kotlinVersion = "1.9.22"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}